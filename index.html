gin:18px}.token{background:#bbdefb}.answer{min-height:76px;border:3px dashed #90caf9;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.reward{font-size:70px;text-align:center}.stars{font-size:48px;letter-spacing:8px}.hidden{display:none}.msg{font-size:20px;font-weight:800;min-height:30px;margin:10px}.score{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.score span{background:#fff3cd;border-radius:14px;padding:7px 12px;font-weight:800}.speak{background:#d1c4e9;margin:6px}.form{display:grid;gap:14px;max-width:520px;margin:20px auto}.form input{font:inherit;font-size:20px;padding:13px;border:2px solid #c5cae9;border-radius:14px}.record{background:#fff8e1;border-radius:14px;padding:12px;margin:8px 0;text-align:left}.hint{background:#fff3e0;padding:10px;border-radius:12px;margin:10px 0;color:#bf360c;font-weight:700}.small{font-size:16px;color:#607d8b}@media(max-width:600px){main{padding:12px}section{padding:18px}.char{font-size:34px}.meaning{font-size:21px}.idiom{gap:10px}button{font-size:18px}}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px auto;max-width:650px}.selectors label{font-weight:800}.selectors select{width:100%;font:inherit;font-size:20px;padding:13px;border:2px solid #c5cae9;border-radius:14px;background:#fff}.courseTitle{text-align:center;font-weight:900;color:#5d4037;margin:8px}.home{background:#b2dfdb;margin:6px}@media(max-width:600px){.selectors{grid-template-columns:1fr}}

.dragToken.selected{outline:4px solid #5c6bc0;background:#fff59d}.dropBlank{display:inline-flex;min-width:86px;height:46px;padding:0 9px;border:3px solid #5c6bc0;border-radius:8px;align-items:center;justify-content:center;vertical-align:middle;color:#3949ab;font-weight:900;background:#fff;box-shadow:inset 0 0 0 2px #eef0ff;margin:2px 4px}.dropBlank.over{background:#e8eaf6}.dropBlank.correct{background:#e8f5e9;border-color:#43a047}.dropBlank.wrong{background:#ffebee;border-color:#e53935}

</style></head><body><main><div class="top"><div id="badge" class="badge">南一國小成語學習</div><div id="stepLabel" class="badge">選擇課程</div></div><div class="score"><span id="studentBadge">👤 尚未輸入姓名</span><span>🪙 <b id="coins">0</b></span><span>⭐ <b id="starsCount">0</b></span></div><div class="progress"><div id="bar"></div></div><section id="card"></section></main><script>const courses={"五年級上學期": {"第一課": [{"w": "疲於奔命", "z": ["ㄆㄧˊ", "ㄩˊ", "ㄅㄣ", "ㄇㄧㄥˋ"], "m": "形容事情繁多，奔波勞累。", "chunks": ["形容", "事情繁多，", "奔波勞累。"], "q": "期末前要準備報告、練習比賽又參加社團，小哲每天忙得____。"}, {"w": "孜孜不倦", "z": ["ㄗ", "ㄗ", "ㄅㄨˊ", "ㄐㄩㄢˋ"], "m": "指勤勉而不知疲倦。", "chunks": ["指勤勉而", "不知疲倦。"], "q": "小晴對天文很有興趣，每天閱讀、查資料，____地學習新知。"}, {"w": "隨遇而安", "z": ["ㄙㄨㄟˊ", "ㄩˋ", "ㄦˊ", "ㄢ"], "m": "指能安於所處的環境。", "chunks": ["指能安於所", "處的環境。"], "q": "校外住宿時房間和家裡不同，小杰很快適應，能夠____。"}, {"w": "如願以償", "z": ["ㄖㄨˊ", "ㄩㄢˋ", "ㄧˇ", "ㄔㄤˊ"], "m": "指心願得以實現。", "chunks": ["指心願得", "以實現。"], "q": "努力準備甄選後，小芸終於加入最想參加的樂團，____。"}, {"w": "錙銖必較", "z": ["ㄗ", "ㄓㄨ", "ㄅㄧˋ", "ㄐㄧㄠˋ"], "m": "連很少的錢或很小的事情都非常計較。", "chunks": ["連很少的錢或很小", "的事情都非常計較。"], "q": "分組買材料時，小豪連一元錢由誰多付都要爭很久，實在太____。"}], "第三課": [{"w": "手不釋卷", "z": ["ㄕㄡˇ", "ㄅㄨˊ", "ㄕˋ", "ㄐㄩㄢˋ"], "m": "手裡總是拿著書卷。形容人勤奮好學。", "chunks": ["手裡總是拿著書卷。", "形容", "人勤奮好學。"], "q": "午休和放學等車時，小芸總拿著小說閱讀，幾乎____。"}, {"w": "楚楚可憐", "z": ["ㄔㄨˇ", "ㄔㄨˇ", "ㄎㄜˇ", "ㄌㄧㄢˊ"], "m": "姿態嬌媚動人，惹人憐愛。亦形容柔弱哀悽或處境不佳，令人憐憫。", "chunks": ["姿態嬌媚動人，", "惹人憐愛。", "亦形容柔弱哀悽或處境不佳，", "令人憐憫。"], "q": "舞臺劇中，小演員演出受委屈的角色，神情____，讓觀眾十分同情。"}, {"w": "道聽塗說", "z": ["ㄉㄠˋ", "ㄊㄧㄥ", "ㄊㄨˊ", "ㄕㄨㄛ"], "m": "泛指沒有經過證實、缺乏根據的話。", "chunks": ["泛指沒有經過證實、", "缺乏根據的話。"], "q": "網路上看到沒有來源的消息，不應立刻轉傳，以免把____當成事實。"}, {"w": "後起之秀", "z": ["ㄏㄡˋ", "ㄑㄧˇ", "ㄓ", "ㄒㄧㄡˋ"], "m": "稱譽後輩中的優秀人物。", "chunks": ["稱譽後輩中", "的優秀人物。"], "q": "五年級新加入的選手進步很快，已成為田徑隊的____。"}, {"w": "自慚形穢", "z": ["ㄗˋ", "ㄘㄢˊ", "ㄒㄧㄥˊ", "ㄏㄨㄟˋ"], "m": "泛指與人相比自愧不如。", "chunks": ["泛指與人相", "比自愧不如。"], "q": "看到別人表現出色就____並否定自己，其實不如找出可以學習的地方。"}], "第五課": [{"w": "懸崖勒馬", "z": ["ㄒㄩㄢˊ", "ㄧㄞˊ", "ㄌㄜˋ", "ㄇㄚˇ"], "m": "比喻到了危險的邊緣而及時回頭。", "chunks": ["比喻", "到了危險的邊緣而及時回頭。"], "q": "小凱原本 function shortParts(text){
  const protectedWords=['比喻','形容'];
  let parts=[];
  const stop=/[，。；、：！？（）「」『』]/;
  function pushSegment(seg){
    if(!seg)return;
    let cs=[];
    for(let i=0;i+2<=seg.length;i++){
      let t=seg.slice(i,i+2);
      if(!meaningfulTwoChar.has(t))continue;
      if(protectedWords.includes(t))continue;
      // 不允許候選跨入「比喻／形容」字串
      if(protectedWords.some(w=>{let x=seg.indexOf(w);return x>=0&&i<x+w.length&&i+2>x}))continue;
      cs.push({start:i,len:2,t,score:3})
    }
    parts.push({t:seg,blank:false,candidates:cs})
  }
  let buf='';
  for(let ch of text){
    if(stop.test(ch)){pushSegment(buf);buf='';parts.push({t:ch,blank:false,punct:true})}
    else buf+=ch
  }
  pushSegment(buf);return parts
}

  let chosen=[];
  for(let c of all){

function semanticChunks(text){
  // 第二關：以短而完整的語意單位拆解，避免把整段話直接當一個區塊。
  // 原文完全保留；優先依標點，再將過長片段切成約 2～6 字的小詞組。
  let out=[];
  text.split(/([，。；、：！？])/).filter(Boolean).forEach(seg=>{
    if(/^[，。；、：！？]$/.test(seg)){
      if(out.length)out[out.length-1]+=seg; else out.push(seg);
      return
    }
    if(seg.length<=6){out.push(seg);return}
    let i=0;
    while(i<seg.length){
      let remain=seg.length-i, len;
      if(remain<=6)len=remain;
      else if(remain===7)len=3;
      else if(remain===8)len=4;
      else len=4;
      out.push(seg.slice(i,i+len));i+=len
    }
  });
  // 避免只有 1 字的孤立卡：併回相鄰語意單位
  for(let i=0;i<out.length;i++){
    let pure=out[i].replace(/[，。；、：！？]/g,'');
    if(pure.length===1&&out.length>1){
      if(i>0){out[i-1]+=out[i];out.splice(i,1);i--}
      else{out[1]=out[0]+out[1];out.shift();i--}
    }
  }
  return out
}

function example(){prog();wrongThis=false;let d=data[i],opts=shuffle(data.map(x=>x.w));card.innerHTML=`<h2>第三關：情境例句選成語</h2><div class="meaning"><b>情境：</b>${esc(d.q)}</div><div class="center"><button class="speak" id="sayQ">🔊 朗讀題目</button></div><div class="center">${opts.map(x=>`<button class="choice" data-x="${x}">${x}</button>`).join('')}<div class="msg"></div><div class="hint hidden">💡 提示：回想每個成語的意思，再判斷最符合描述的是哪一個。</div></div>`;sayQ.onclick=()=>speak(d.q);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.x===d.w){b.classList.add('correct');document.querySelector('.msg').textContent=wrongThis?'選對了！修正成功！ +10 金幣':'一次選對！ +10 金幣、+1 星星';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);earn();setTimeout(()=>{if(++i<data.length)example();else reward()},800)}else{b.disabled=true;b.classList.add('wrong');miss('第三關',d,'情境題選錯：'+b.dataset.x);document.querySelector('.msg').textContent='這個成語和描述不太符合，再想想！';document.querySelector('.hint').classList.remove('hidden')}})}
function reward(){mode='done';prog();let max=data.length*3,level=stars>=Math.ceil(max*.85)?'成語小博士':stars>=Math.ceil(max*.65)?'成語高手':'努力學習家';let result={id:newId(),student,date:testDate,grade,lesson,coins,stars,max,level,finishedAt:new Date().toISOString(),mistakes:mistakes.map(m=>({...m}))},saved=addRecords([result])>0,code=encodeRecord(result);sendToSheet(result);let recHtml=mistakes.length?mistakes.map((m,k)=>`<div class="record"><b>${k+1}. ${m.stage}｜${m.word}</b><br>${esc(m.detail)}</div>`).join(''):'<div class="record">🎉 本次沒有錯題紀錄！</div>';card.innerHTML=`<h1>恭喜完成${lesson}！</h1><div class="reward">🏆</div><h2 class="center">${esc(student)}：${level}</h2><div class="courseTitle">${grade}・${lesson}</div><div class="score"><span>📅 ${testDate}</span><span>🪙 ${coins} 金幣</span><span>⭐ ${stars}/${max} 星星</span></div><p class="center">你完成了「找回詞語 → 重組釋義 → 情境運用」三道關卡。</p><h2>錯題紀錄</h2>${recHtml}<h2>交給老師</h2><div class="record">${saved?'✅ 成果已自動儲存在這台裝置，老師可從首頁的「教師專區」查看。':'⚠️ 這台裝置無法儲存紀錄，請把下方成果代碼交給老師。'}${SHEET_URL?'<br>☁️ 成果也會同步送到老師的 Google 試算表。':''}<br>使用自己的裝置時，請按「複製成果代碼」，再貼給老師（例如 Google Classroom、LINE）。</div><textarea id="resultCode" class="codeBox" readonly>${code}</textarea><div class="center"><button class="speak" id="copyCode">📋 複製成果代碼</button></div><div class="center"><button class="speak" id="review">🔊 朗讀本課成語</button><button class="primary" id="again">本課再玩一次</button><button class="home" id="home">選擇其他課程</button></div>`;review.onclick=()=>speak(data.map(x=>x.w).join('。'));again.onclick=()=>{i=0;coins=0;stars=0;mistakes=[];updateScore();mode='learn';learn()};home.onclick=setup;document.querySelector('#copyCode').onclick=e=>copyCode(e.target)}
// ===== 學習成果紀錄與教師專區 =====
const STORE_KEY='idiomLadderRecords',PIN_KEY='idiomLadderTeacherPin';
// 選填：老師的 Google 試算表 Apps Script 網址（設定方式見 README）。留空則成果只存在各裝置。
const SHEET_URL='';
function loadRecords(){try{let r=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');return Array.isArray(r)?r.map(cleanRecord).filter(Boolean):[]}catch(e){return[]}}
function saveRecords(r){try{localStorage.setItem(STORE_KEY,JSON.stringify(r));return true}catch(e){return false}}
function getPin(){try{return localStorage.getItem(PIN_KEY)||''}catch(e){return''}}
function setPin(p){try{localStorage.setItem(PIN_KEY,p);return true}catch(e){return false}}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function cleanRecord(r){
  if(!r||typeof r!=='object')return null;
  let n=x=>Number.isFinite(+x)?Math.max(0,Math.round(+x)):0,t=x=>String(x??'').slice(0,200);
  return{id:t(r.id)||newId(),student:t(r.student),date:t(r.date),grade:t(r.grade),lesson:t(r.lesson),coins:n(r.coins),stars:n(r.stars),max:n(r.max),level:t(r.level),finishedAt:t(r.finishedAt),
    mistakes:Array.isArray(r.mistakes)?r.mistakes.slice(0,300).map(m=>({stage:t(m&&m.stage),word:t(m&&m.word),detail:t(m&&m.detail)})):[]}
}
function addRecords(list){let all=loadRecords(),ids=new Set(all.map(r=>r.id)),added=0;list.forEach(r=>{r=cleanRecord(r);if(r&&!ids.has(r.id)){all.push(r);ids.add(r.id);added++}});return saveRecords(all)?added:0}
function encodeRecord(r){let s='';new TextEncoder().encode(JSON.stringify(r)).forEach(b=>s+=String.fromCharCode(b));return'IDL1:'+btoa(s)}
function decodeCodes(text){return(text.match(/IDL1:[A-Za-z0-9+/=]+/g)||[]).map(c=>{try{return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.slice(5)),ch=>ch.charCodeAt(0))))}catch(e){return null}}).filter(Boolean)}
function sendToSheet(r){if(!SHEET_URL)return;try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r)}).catch(()=>{})}catch(e){}}
function copyCode(btn){let box=document.querySelector('#resultCode'),ok=()=>{btn.textContent='✅ 已複製，請貼給老師'};
  function fallback(){box.focus();box.select();box.setSelectionRange(0,box.value.length);try{if(document.execCommand('copy'))return ok()}catch(e){}alert('請長按代碼，選擇「全選」→「拷貝」')}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(box.value).then(ok,fallback);else fallback()}
function rate(r){return r.max?Math.round(r.stars/r.max*100):0}
function fmtTime(t,full){let d=new Date(t);return isNaN(d)?'':d.toLocaleString('zh-TW',full?{hour12:false}:{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function teacher(){
  mode='teacher';prog();badge.textContent='教師專區';let pin=getPin();
  card.innerHTML=`<h1>👩‍🏫 教師專區</h1><div class="small center">${pin?'請輸入教師密碼':'第一次使用，請設定教師密碼（至少 4 碼）'}</div><div class="form"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="教師密碼">${pin?'':'<input id="pin2" type="password" inputmode="numeric" autocomplete="off" placeholder="再輸入一次密碼">'}<button class="primary" id="pinOk">${pin?'進入':'設定並進入'}</button><div class="msg center"></div><button class="home" id="back">← 返回</button></div>`;
  let msg=document.querySelector('.msg'),p1=document.querySelector('#pin'),p2=document.querySelector('#pin2');
  function go(){let v=p1.value.trim();
    if(pin){if(v===pin)teacherPanel();else{msg.textContent='密碼不正確';p1.value='';p1.focus()}return}
    if(v.length<4){msg.textContent='密碼至少需要 4 碼';return}
    if(v!==p2.value.trim()){msg.textContent='兩次輸入的密碼不同';return}
    if(!setPin(v)){msg.textContent='這台裝置無法儲存密碼';return}
    teacherPanel()}
  document.querySelector('#pinOk').onclick=go;[p1,p2].forEach(x=>x&&x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  document.querySelector('#back').onclick=setup;p1.focus()
}
let tFilter={grade:'',lesson:'',name:''};
function filteredRecords(){let q=tFilter.name.trim();return loadRecords().filter(r=>(!tFilter.grade||r.grade===tFilter.grade)&&(!tFilter.lesson||r.lesson===tFilter.lesson)&&(!q||r.student.includes(q))).sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt))}
function teacherPanel(){
  mode='teacher';prog();badge.textContent='教師專區';
  let opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`;
  card.innerHTML=`<h1>👩‍🏫 學生學習成果</h1><div class="small center">學生完成課程後，成果會自動存在該裝置的瀏覽器中。學生使用自己的裝置時，請他們把「成果代碼」交給您，再貼到下方匯入。</div>
  <div class="filters"><label>年級／學期<select id="fGrade"><option value="">全部</option>${Object.keys(courses).map(g=>opt(g,tFilter.grade)).join('')}</select></label><label>課次<select id="fLesson"><option value="">全部</option>${lessonOrder.map(l=>opt(l,tFilter.lesson)).join('')}</select></label><label>學生姓名<input id="fName" value="${esc(tFilter.name)}" placeholder="搜尋姓名"></label></div>
  <div id="tResult"></div>
  <h2>匯入成果代碼</h2><textarea id="importBox" class="codeBox" placeholder="把學生的成果代碼貼在這裡（可一次貼上多個）"></textarea><div class="center"><button class="speak" id="importBtn">📥 匯入</button><div class="msg" id="importMsg"></div></div>
  <h2>管理</h2><div class="center"><button class="primary" id="csvBtn">📊 匯出 Excel（CSV）</button><button class="speak" id="pinBtn">🔑 修改密碼</button><button class="danger" id="clearBtn">🗑️ 清除全部紀錄</button><button class="home" id="back">← 返回首頁</button></div>`;
  document.querySelector('#fGrade').onchange=e=>{tFilter.grade=e.target.value;renderTeacherResults()};
  document.querySelector('#fLesson').onchange=e=>{tFilter.lesson=e.target.value;renderTeacherResults()};
  document.querySelector('#fName').oninput=e=>{tFilter.name=e.target.value;renderTeacherResults()};
  document.querySelector('#importBtn').onclick=()=>{let box=document.querySelector('#importBox'),list=decodeCodes(box.value),im=document.querySelector('#importMsg');
    if(!list.length){im.textContent='找不到有效的成果代碼（代碼以 IDL1: 開頭）';return}
    let added=addRecords(list);im.textContent=`已匯入 ${added} 筆紀錄`+(list.length>added?`，略過 ${list.length-added} 筆重複紀錄`:'');box.value='';renderTeacherResults()};
  document.querySelector('#csvBtn').onclick=exportCsv;
  document.querySelector('#pinBtn').onclick=()=>{let a=prompt('請輸入新的教師密碼（至少 4 碼）');if(a===null)return;a=a.trim();if(a.length<4)return alert('密碼至少需要 4 碼');if(prompt('請再輸入一次新密碼')?.trim()!==a)return alert('兩次輸入的密碼不同，未修改');alert(setPin(a)?'密碼已修改':'無法儲存密碼')};
  document.querySelector('#clearBtn').onclick=()=>{let n=loadRecords().length;if(!n)return alert('目前沒有紀錄');if(confirm(`確定要刪除這台裝置上的全部 ${n} 筆紀錄嗎？\n刪除後無法復原，建議先匯出 Excel。`)){saveRecords([]);renderTeacherResults()}};
  document.querySelector('#back').onclick=setup;
  renderTeacherResults()
}
function renderTeacherResults(){
  let list=filteredRecords(),box=document.querySelector('#tResult');
  if(!list.length){box.innerHTML='<div class="record center">目前沒有符合條件的學習紀錄。</div>';return}
  let avg=Math.round(list.reduce((t,r)=>t+rate(r),0)/list.length),missed={};
  list.forEach(r=>r.mistakes.forEach(m=>{let x=missed[m.word]=missed[m.word]||{word:m.word,n:0,stages:{}};x.n++;x.stages[m.stage]=(x.stages[m.stage]||0)+1}));
  let top=Object.values(missed).sort((a,b)=>b.n-a.n).slice(0,10);
  box.innerHTML=`<div class="score"><span>📋 ${list.length} 筆紀錄</span><span>👥 ${new Set(list.map(r=>r.student)).size} 位學生</span><span>🎯 平均一次答對率 ${avg}%</span></div>
  <div class="tableWrap"><table class="rtable"><thead><tr><th>完成時間</th><th>學生</th><th>課程</th><th>⭐ 星星</th><th>一次答對率</th><th>錯誤次數</th><th>等級</th><th></th></tr></thead><tbody>${list.map((r,k)=>`<tr><td>${esc(fmtTime(r.finishedAt))}<div class="small">測驗日 ${esc(r.date)}</div></td><td><b>${esc(r.student)}</b></td><td>${esc(r.grade)}<br>${esc(r.lesson)}</td><td>${r.stars}/${r.max}</td><td><span class="rate ${rate(r)>=85?'good':rate(r)>=65?'ok':'low'}">${rate(r)}%</span></td><td>${r.mistakes.length}</td><td>${esc(r.level)}</td><td><button class="mini" data-detail="${k}">錯題</button><button class="mini del" data-del="${k}">刪除</button></td></tr><tr class="detailRow hidden" data-row="${k}"><td colspan="8">${r.mistakes.length?r.mistakes.map((m,j)=>`${j+1}. <b>${esc(m.stage)}｜${esc(m.word)}</b>：${esc(m.detail)}`).join('<br>'):'🎉 沒有錯題'}</td></tr>`).join('')}</tbody></table></div>
  <h2>最常錯的成語</h2>${top.length?top.map(x=>`<div class="record"><b>${esc(x.word)}</b>　錯 ${x.n} 次（${Object.entries(x.stages).map(([s,c])=>`${esc(s)} ${c} 次`).join('、')}）</div>`).join(''):'<div class="record">🎉 沒有錯題紀錄！</div>'}`;
  box.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>box.querySelector(`[data-row="${b.dataset.detail}"]`).classList.toggle('hidden'));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let r=list[+b.dataset.del];if(confirm(`確定刪除「${r.student}｜${r.grade}・${r.lesson}」這筆紀錄嗎？`)){saveRecords(loadRecords().filter(x=>x.id!==r.id));renderTeacherResults()}})
}
function csvCell(v){v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){
  let list=filteredRecords();if(!list.length)return alert('沒有可匯出的紀錄');
  let rows=[['完成時間','測驗日期','學生','年級學期','課次','金幣','星星','滿分星星','一次答對率','錯誤次數','等級','錯題明細'],
    ...list.map(r=>[fmtTime(r.finishedAt,true),r.date,r.student,r.grade,r.lesson,r.coins,r.stars,r.max,rate(r)+'%',r.mistakes.length,r.level,r.mistakes.map(m=>`${m.stage}｜${m.word}｜${m.detail}`).join('；')])];
  let url=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=`idiom-results_${new Date().toLocaleDateString('en-CA')}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
const badge=document.querySelector('#badge'),stepLabel=document.querySelector('#stepLabel'),bar=document.querySelector('#bar'),coinsEl=document.querySelector('#coins'),starsEl=document.querySelector('#starsCount'),studentBadge=document.querySelector('#studentBadge');setup();</script></body></html>
