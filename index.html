*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:#fff8e7;color:#263238}main{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:#fff;border:3px solid #ffca28;border-radius:18px;padding:8px 14px;font-weight:800}.progress{height:14px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin:14px 0 24px}.progress>div{height:100%;background:#66bb6a;width:0;transition:.4s}section{background:#fff;border-radius:24px;padding:24px;box-shadow:0 6px 18px #0001;margin-bottom:20px}h1{text-align:center;color:#ef6c00}h2{text-align:center}.idiom{display:flex;justify-content:center;gap:16px;margin:28px 0;flex-wrap:wrap}.char{font-size:42px;font-weight:900;display:flex;align-items:center}.meaning{font-size:24px;line-height:1.8;min-height:90px;padding:16px;background:#f6f8ff;border-radius:16px}.cursor{border-right:3px solid #333;animation:blink .7s infinite}@keyframes blink{50%{border-color:transparent}}button{font:inherit;font-size:20px;font-weight:800;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;touch-action:manipulation}.primary{background:#ffca28}.choice{background:#e8eaf6;margin:7px}.choice:hover{background:#c5cae9}.choice.correct{background:#a5d6a7}.choice.wrong{background:#ef9a9a}.center{text-align:center}.blank{display:inline-flex;min-width:120px;height:46px;padding:0 12px;border:3px solid #5c6bc0;border-radius:8px;align-items:center;justify-content:center;vertical-align:middle;text-align:center;color:#3949ab;font-weight:800;background:#fff;box-shadow:inset 0 0 0 2px #eef0ff;margin:0 4px}.blankSelect{font:inherit;font-size:20px;min-width:105px;max-width:180px;margin:4px 5px;padding:4px 8px;background:#fff}.blankSelect.correct{background:#e8f5e9;border-color:#43a047}.blankSelect.wrong{background:#ffebee;border-color:#e53935}.tokens{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px}.token{background:#bbdefb}.answer{min-height:76px;border:3px dashed #90caf9;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.reward{font-size:70px;text-align:center}.stars{font-size:48px;letter-spacing:8px}.hidden{display:none}.msg{font-size:20px;font-weight:800;min-height:30px;margin:10px}.score{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.score span{background:#fff3cd;border-radius:14px;padding:7px 12px;font-weight:800}.speak{background:#d1c4e9;margin:6px}.form{display:grid;gap:14px;max-width:520px;margin:20px auto}.form input{font:inherit;font-size:20px;padding:13px;border:2px solid #c5cae9;border-radius:14px}.record{background:#fff8e1;border-radius:14px;padding:12px;margin:8px 0;text-align:left}.hint{background:#fff3e0;padding:10px;border-radius:12px;margin:10px 0;color:#bf360c;font-weight:700}.small{font-size:16px;color:#607d8b}@media(max-width:600px){main{padding:12px}section{padding:18px}.char{font-size:34px}.meaning{font-size:21px}.idiom{gap:10px}button{font-size:18px}}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px auto;max-width:650px}.selectors label{font-weight:800}.selectors select{width:100%;font:inherit;font-size:20px;padding:13px;border:2px solid #c5cae9;border-radius:14px;background:#fff}.courseTitle{text-align:center;font-weight:900;color:#5d4037;margin:8px}.home{background:#b2dfdb;margin:6px}@media(max-width:600px){.selectors{grid-template-columns:1fr}}
.dragBank{min-height:86px;border:3px dashed #ffb74d;border-radius:18px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:#fff8e1;margin:18px 0}
.dragToken{background:#ffe082;border:2px solid #f9a825;border-radius:14px;padding:10px 16px;font-size:21px;font-weight:900;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 7px #0002}
.dragToken.selected{outline:4px solid #5c6bc0;background:#fff59d}.dropBlank{display:inline-flex;min-width:86px;height:46px;padding:0 9px;border:3px solid #5c6bc0;border-radius:8px;align-items:center;justify-content:center;vertical-align:middle;color:#3949ab;font-weight:900;background:#fff;box-shadow:inset 0 0 0 2px #eef0ff;margin:2px 4px}.dropBlank.over{background:#e8eaf6}.dropBlank.correct{background:#e8f5e9;border-color:#43a047}.dropBlank.wrong{background:#ffebee;border-color:#e53935}

.tableWrap{overflow-x:auto;margin:12px 0}.rtable{width:100%;border-collapse:collapse;font-size:16px;min-width:680px}.rtable th,.rtable td{padding:8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.rtable th{background:#fff3cd;white-space:nowrap}.detailRow td{background:#fafafa}

</style></head><body><main><div class="top"><div id="badge" class="badge">南一國小成語學習</div><div id="stepLabel" class="badge">選擇課程</div></div><div class="score"><span id="studentBadge">👤 尚未輸入姓名</span><span>🪙 <b id="coins">0</b></span><span>⭐ <b id="starsCount">0</b></span></div><div class="progress"><div id="bar"></div></div><section id="card"></section></main><script>const courses={"五年級上學期": {"第一課": [{"w": "疲於奔命", "z": ["ㄆㄧˊ", "ㄩˊ", "ㄅㄣ", "ㄇㄧㄥˋ"], "m": "形容事情繁多，奔波勞累。", "chunks": ["形容", "事情繁多，", "奔波勞累。"], "q": ["期末前要準備報告、練習比賽又參加社團，小哲每天忙得____。", "媽媽白天上班，下班後還要接送我們上才藝班、準備晚餐，常常____，累得說不出話。", "球賽中我們隊一直被對手調動，防守的同學左跑右跑、____，最後體力都用光了。"]}, {"w": "孜孜不倦", "z": ["ㄗ", "ㄗ", "ㄅㄨˊ", "ㄐㄩㄢˋ"], "m": "指勤勉而不知疲倦。", "chunks": ["指勤勉而", "不知疲倦。"], "q": ["小晴對天文很有興趣，每天閱讀、查資料，____地學習新知。", "爺爺退休後仍____地學習使用電腦，現在已經會用平板和我們視訊了。", "圖書館的志工阿姨每天研讀繪本、練習說故事，那份____的精神讓人敬佩。"]}, {"w": "隨遇而安", "z": ["ㄙㄨㄟˊ", "ㄩˋ", "ㄦˊ", "ㄢ"], "m": "指能安於所處的環境。", "chunks": ["指能安於所", "處的環境。"], "q": ["校外住宿時房間和家裡不同，小杰很快適應，能夠____。", "轉學到新學校後，小安沒有抱怨，而是____，很快就交到了新朋友。", "露營時遇到下雨只能待在帳篷裡，爸爸笑著說要____，帶我們玩起了猜謎遊戲。"]}, {"w": "如願以償", "z": ["ㄖㄨˊ", "ㄩㄢˋ", "ㄧˇ", "ㄔㄤˊ"], "m": "指心願得以實現。", "chunks": ["指心願得", "以實現。"], "q": ["努力準備甄選後，小芸終於加入最想參加的樂團，____。", "哥哥存了半年的零用錢，終於____，買到心目中的那套百科全書。", "我們班練習了一整個學期的大隊接力，這次終於____，拿下全年級第一名。"]}, {"w": "錙銖必較", "z": ["ㄗ", "ㄓㄨ", "ㄅㄧˋ", "ㄐㄧㄠˋ"], "m": "連很少的錢或很小的事情都非常計較。", "chunks": ["連很少的錢或很小", "的事情都非常計較。"], "q": ["分組買材料時，小豪連一元錢由誰多付都要爭很久，實在太____。", "跟朋友相處不必____，偶爾多分享一點零食，友誼會更好。", "他和弟弟分糖果時連一顆都要算清楚，這種____的態度讓弟弟很難過。"]}], "第三課": [{"w": "手不釋卷", "z": ["ㄕㄡˇ", "ㄅㄨˊ", "ㄕˋ", "ㄐㄩㄢˋ"], "m": "手裡總是拿著書卷。形容人勤奮好學。", "chunks": ["手裡總是拿著書卷。", "形容", "人勤奮好學。"], "q": ["午休和放學等車時，小芸總拿著小說閱讀，幾乎____。", "表姊很愛閱讀，連坐捷運時也____，一年讀了上百本書。", "老師說古人勤學，常常____；我們也該把讀書當成每天的好習慣。"]}, {"w": "楚楚可憐", "z": ["ㄔㄨˇ", "ㄔㄨˇ", "ㄎㄜˇ", "ㄌㄧㄢˊ"], "m": "姿態嬌媚動人，惹人憐愛。亦形容柔弱哀悽或處境不佳，令人憐憫。", "chunks": ["姿態嬌媚動人，", "惹人憐愛。", "亦形容柔弱哀悽或處境不佳，", "令人憐憫。"], "q": ["舞臺劇中，小演員演出受委屈的角色，神情____，讓觀眾十分同情。", "被雨淋濕的小貓縮在牆角，眼神____，讓我們忍不住拿毛巾幫牠擦乾。", "妹妹打破杯子後低著頭、眼眶泛紅，那____的模樣讓媽媽也不忍心責罵。"]}, {"w": "道聽塗說", "z": ["ㄉㄠˋ", "ㄊㄧㄥ", "ㄊㄨˊ", "ㄕㄨㄛ"], "m": "泛指沒有經過證實、缺乏根據的話。", "chunks": ["泛指沒有經過證實、", "缺乏根據的話。"], "q": ["網路上看到沒有來源的消息，不應立刻轉傳，以免把____當成事實。", "寫報告要查證可靠的資料，不能把____的消息當成證據。", "「聽說學校要停課一週」只是____，大家還是要以學校的公告為準。"]}, {"w": "後起之秀", "z": ["ㄏㄡˋ", "ㄑㄧˇ", "ㄓ", "ㄒㄧㄡˋ"], "m": "稱譽後輩中的優秀人物。", "chunks": ["稱譽後輩中", "的優秀人物。"], "q": ["五年級新加入的選手進步很快，已成為田徑隊的____。", "這位年輕的棋手只學了兩年就打敗許多前輩，是棋壇令人期待的____。", "合唱團今年加入不少四年級學弟妹，其中幾位歌聲出色，是團裡的____。"]}, {"w": "自慚形穢", "z": ["ㄗˋ", "ㄘㄢˊ", "ㄒㄧㄥˊ", "ㄏㄨㄟˋ"], "m": "泛指與人相比自愧不如。", "chunks": ["泛指與人相", "比自愧不如。"], "q": ["看到別人表現出色就____並否定自己，其實不如找出可以學習的地方。", "看到同學的作品那麼精美，小安有些____，但他決定向同學請教技巧。", "每個人都有自己的優點，不必因為一時比不上別人就____。"]}], "第五課": [{"w": "懸崖勒馬", "z": ["ㄒㄩㄢˊ", "ㄧㄞˊ", "ㄌㄜˋ", "ㄇㄚˇ"], "m": "比喻到了危險的邊緣而及時回頭。", "chunks": ["比喻", "到了危險的邊緣而及時回頭。"], "q": ["小凱原本想把同學的糗照傳到群組，想到可能傷人後立刻刪除，算是及時____。", "小明差點偷看同學的考卷，想起老師說的誠實，立刻____，自己認真作答。", "哥哥原本想熬夜打電動，想到明天要比賽，便____，關掉電腦去睡覺。"]}, {"w": "班門弄斧", "z": ["ㄅㄢ", "ㄇㄣˊ", "ㄋㄨㄥˋ", "ㄈㄨˇ"], "m": "比喻在專家面前賣弄本事，不自量力。", "chunks": ["比喻", "在專家面前賣弄本事，", "不自量力。"], "q": ["在全國冠軍面前炫耀自己剛學會的技巧，難免有些____。", "在書法老師面前展示我剛學的毛筆字，真有點____的感覺。", "他在職業魔術師面前表演剛學會的小魔術，自己也笑說是____。"]}, {"w": "一決雌雄", "z": ["ㄧˋ", "ㄐㄩㄝˊ", "ㄘ", "ㄒㄩㄥˊ"], "m": "比喻互相較量以決定勝敗、高下。", "chunks": ["比喻", "互相較量以決定勝敗、", "高下。"], "q": ["兩支實力接近的球隊約好在決賽中____，看看誰能奪冠。", "兩位象棋高手約在週末的比賽中____，看誰才是全校棋王。", "甲班和乙班的拔河隊在決賽相遇，終於要____了。"]}, {"w": "臨深履薄", "z": ["ㄌㄧㄣˊ", "ㄕㄣ", "ㄌㄩˇ", "ㄅㄛˊ"], "m": "臨近深淵，踩踏薄冰。比喻戒慎恐懼，十分小心。", "chunks": ["臨近深淵，", "踩踏薄冰。", "比喻", "戒慎恐懼，十分小心。"], "q": ["第一次負責全班園遊會帳目，小隊長處處核對，做事如同____般謹慎。", "第一次幫忙抱剛出生的小表弟，我心情就像____，生怕他不舒服。", "搬運自然課的玻璃燒杯時，值日生抱著箱子____地慢慢走，絲毫不敢大意。"]}, {"w": "醉生夢死", "z": ["ㄗㄨㄟˋ", "ㄕㄥ", "ㄇㄥˋ", "ㄙˇ"], "m": "形容人缺乏目標，生活過得糊裡糊塗。", "chunks": ["形容", "人缺乏目標，", "生活過得糊裡糊塗。"], "q": ["如果每天沉迷遊戲、沒有目標也不安排生活，長期下來容易過著____的日子。", "故事裡的國王整天只顧玩樂、不管百姓，過著____的生活，最後失去了國家。", "老師提醒大家，暑假不能____地只顧看電視，也要安排閱讀和運動。"]}], "第七課": [{"w": "設身處地", "z": ["ㄕㄜˋ", "ㄕㄣ", "ㄔㄨˇ", "ㄉㄧˋ"], "m": "假想自己處在與他人相同的情況中。", "chunks": ["假想自己處在與他", "人相同的情況中。"], "q": ["朋友比賽失利時，先____想想他的感受，再決定怎麼安慰他。", "如果能____替清潔阿姨想一想，我們就不會隨手亂丟垃圾。", "新同學還不認識大家，我們____地想一想，就知道主動和他說話有多重要。"]}, {"w": "汗牛充棟", "z": ["ㄏㄢˋ", "ㄋㄧㄡˊ", "ㄔㄨㄥ", "ㄉㄨㄥˋ"], "m": "形容書籍極多。", "chunks": ["形容", "書籍極多。"], "q": ["圖書館新館藏種類繁多、數量驚人，可以說是____。", "爺爺的書房裡藏書____，從歷史到科學的書都有。", "介紹恐龍的書籍____，我們要學會挑選適合自己的那一本。"]}, {"w": "雪上加霜", "z": ["ㄒㄩㄝˇ", "ㄕㄤˋ", "ㄐㄧㄚ", "ㄕㄨㄤ"], "m": "比喻禍患接踵而至，使傷害加重。", "chunks": ["比喻", "禍患接踵而至，", "使傷害加重。"], "q": ["小組電腦已經故障，偏偏報告檔又忘了備份，真是____。", "小華感冒還沒好，又不小心扭傷了腳，真是____。", "颱風吹倒了果園的樹，接著又連下好幾天大雨，對果農來說無疑是____。"]}, {"w": "不著邊際", "z": ["ㄅㄨˋ", "ㄓㄨㄛˊ", "ㄅㄧㄢ", "ㄐㄧˋ"], "m": "說話、做事不切實際或離題太遠。", "chunks": ["說話、", "做事不切實際或離題太遠。"], "q": ["討論環保主題時，小明一直談遊戲角色，內容十分____。", "老師問小明為什麼遲到，他卻談起昨晚的卡通，回答得____。", "寫作文要扣緊題目，如果內容____，就算字數很多也拿不到高分。"]}, {"w": "不遺餘力", "z": ["ㄅㄨˋ", "ㄧˊ", "ㄩˊ", "ㄌㄧˋ"], "m": "不保留一點力氣。形容竭盡全力，毫無保留。", "chunks": ["不保留一點力氣。", "形容", "竭盡全力，", "毫無保留。"], "q": ["為了完成班級展覽，全組同學都____地準備資料與作品。", "志工們____地幫助弱勢家庭，讓孩子們也能安心上學。", "為了保護海龜，這群學生____地淨灘，撿起了一袋又一袋垃圾。"]}], "第九課": [{"w": "同心協力", "z": ["ㄊㄨㄥˊ", "ㄒㄧㄣ", "ㄒㄧㄝˊ", "ㄌㄧˋ"], "m": "團結一致，共同努力。", "chunks": ["團結一致，", "共同努力。"], "q": ["拔河比賽中，全班只有____、一起用力，才有機會獲勝。", "社區居民____清理水溝，終於解決了蚊子很多的問題。", "只要全組____，再難的科展題目也能完成。"]}, {"w": "以鄰為壑", "z": ["ㄧˇ", "ㄌㄧㄣˊ", "ㄨㄟˊ", "ㄏㄨㄛˋ"], "m": "比喻將困難和災禍推到別人身上。", "chunks": ["比喻", "將困難和災禍推到別人身上。"], "q": ["自己不想處理垃圾就偷偷丟到別班區域，是____的做法。", "有些工廠把廢水偷偷排到下游，讓別人承受汙染，這種____的行為應該受到處罰。", "掃地時把垃圾掃到隔壁班的走廊，是____的做法，大家都不該這樣做。"]}, {"w": "反求諸己", "z": ["ㄈㄢˇ", "ㄑㄧㄡˊ", "ㄓㄨ", "ㄐㄧˇ"], "m": "反過來自我省察。指從自己本身找出原因，自我反省。", "chunks": ["反過來自我省察。", "指從自己本身找出原因，", "自我反省。"], "q": ["比賽失利後，與其只怪隊友，不如先____，看看自己哪裡能改進。", "考試成績不理想時，與其怪題目太難，不如____，檢查自己的讀書方法。", "同學不太想跟他玩，他沒有生氣，而是____，想想自己是不是太霸道了。"]}], "第十一課": [{"w": "垂頭喪氣", "z": ["ㄔㄨㄟˊ", "ㄊㄡˊ", "ㄙㄤˋ", "ㄑㄧˋ"], "m": "形容意志消沉、失意沮喪的樣子。", "chunks": ["形容", "意志消沉、", "失意沮喪的樣子。"], "q": ["得知沒有入選校隊，小杰____地走回教室。", "球隊輸了比賽，大家____地坐在場邊，教練鼓勵我們下次再加油。", "小明的風箏才剛飛上天就斷了線，他只好____地走回家。"]}, {"w": "精衛填海", "z": ["ㄐㄧㄥ", "ㄨㄟˋ", "ㄊㄧㄢˊ", "ㄏㄞˇ"], "m": "比喻意志堅定，不懼艱苦。", "chunks": ["比喻", "意志堅定，", "不懼艱苦。"], "q": ["她每天練習一點，即使進步很慢也不放棄，展現____般的毅力。", "想把壞習慣改掉，就要有____般的決心，每天一點一點地努力。", "這位爺爺數十年來每天到海邊撿垃圾，那份____的精神感動了很多人。"]}, {"w": "惡貫 function shortParts(text){
  const protectedWords=['比喻','形容'];
  let parts=[];
  const stop=/[，。；、：！？（）「」『』]/;
  function pushSegment(seg){
    if(!seg)return;
    let cs=[];
    for(let i=0;i+2<=seg.length;i++){
      let t=seg.slice(i,i+2);
      if(!meaningfulTwoChar.has(t))continue;
      if(protectedWords.includes(t))continue;
      // 不允許候選跨入「比喻／形容」字串
      if(protectedWords.some(w=>{let x=seg.indexOf(w);return x>=0&&i<x+w.length&&i+2>x}))continue;
      cs.push({start:i,len:2,t,score:3})
    }
    parts.push({t:seg,blank:false,candidates:cs})
  }
  let buf='';
  for(let ch of text){
    if(stop.test(ch)){pushSegment(buf);buf='';parts.push({t:ch,blank:false,punct:true})}
    else buf+=ch
  }
  pushSegment(buf);return parts
}
function pickBlanks(d){
  let parts=shortParts(d.m),all=[];
  parts.forEach((p,pi)=>(p.candidates||[]).forEach(c=>all.push({...c,pi})));
  all.sort((a,b)=>b.score-a.score||b.len-a.len||a.pi-b.pi||a.start-b.start);
  let chosen=[];
  for(let c of all){
    if(chosen.some(x=>x.pi===c.pi && !(c.start+c.len<=x.start || x.start+x.len<=c.start)))continue;
    if(chosen.some(x=>x.t===c.t))continue; // 同一題不重複挖同一個詞
    chosen.push(c);
    if(chosen.length>=3)break;
  }
  // 原則 2–3 格；若原釋義無法找到兩個不重疊且符合 2/4 字規則的自然片段，寧可少挖，不改寫原意。
  if(chosen.length>2 && d.m.length<12)chosen=chosen.slice(0,2);
  // 保底：詞庫找不到任何詞語時，仍至少挖一格，避免題目沒有空格可作答。
  if(!chosen.length){
    let best=null;
    parts.forEach((p,pi)=>{if(p.punct)return;for(let s=0;s+2<=p.t.length;s++){let t=p.t.slice(s,s+2);if(['比喻','形容'].some(w=>{let x=p.t.indexOf(w);return x>=0&&s<x+w.length&&s+2>x}))continue;if(!best||p.t.length>parts[best.pi].t.length)best={start:s,len:2,t,score:1,pi};break}});
    if(best)chosen=[best]
  }
  chosen.sort((a,b)=>a.pi-b.pi||a.start-b.start);
  return{parts,chosen}
}

function semanticChunks(text){
